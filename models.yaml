default: deepseek-flash
models:
  - id: deepseek-flash
    label: DeepSeek v4.1 Flash (routerai)
    base_url: https://routerai.ru/api/v1
    api_key_env: ROUTERAI_API_KEY
    model: deepseek/deepseek-v4.1-flash
    max_tokens: 200000
    temperature: 0.3
  - id: glm-5.3-flash
    label: glm-5.3 flash
    base_url: https://routerai.ru/api/v1
    api_key_env: ROUTERAI_API_KEY
    model: ~z-ai/glm-flash-latest
    max_tokens: 800000
    temperature: 0.3
